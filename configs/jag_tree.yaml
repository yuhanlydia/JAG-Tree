schema_version: "0.1"
direction: jag_tree
base_config: shared.yaml
status: phase0_reference_implementation_available

estimator:
  name: recursive_joint_value_gradient
  segment_tokens: 256
  max_generation_segments_primary: 8
  max_generation_segments_sensitivity: 16
  branchable_depth_count: 3
  max_branching: 4
  minimum_children: 1
  primary_baseline: lagged_cross_fitted_value
  sibling_loo_ablation_requires_u_statistic_variance: true
  hard_pruning: false
  score_sketch_dimension: 256
  score_sketch_distribution: rademacher_scaled
  score_sketch_seed: 7321
  exact_gradient_blocks: 3

allocator:
  target: gradient_mse_per_generated_token
  covariance: joint_value_gradient
  ancestor_transport_weight: squared_product_inverse_branching
  synthetic_root_weight: 1.0
  cost_predictor: lagged
  outcome_access_before_allocation: false

phase0:
  executable_overlays: [phase0/jag_smoke.yaml]
  environment: finite_mdp
  horizon: 8
  actions: 4
  reward_families: [root_only, suffix_only, entropy_distractor, covariance_reversal]
  reference: exact_enumeration
  rollout_replications: 100000
  arms: [flat_iid, uniform_tree, leaf_equal_naive, entropy_tree, value_variance_tree, gradient_only, joint_no_cross, jag_oracle, jag_learned]
  gate:
    gradient_mse_per_token_relative_reduction: 0.25
    relative_bias_max: 0.01
    bias_z_score_max: 2.0
    confidence_coverage_min: 0.90
    learned_oracle_uniform_gap_closed_min: 0.70
    cross_term_family_relative_gain_min: 0.10

phase1:
  model: Qwen/Qwen2.5-Coder-7B-Instruct
  policy: frozen
  calibration_tasks: 256
  audit_tasks: 64
  root_samples: 4
  root_samples_min: 1
  root_samples_max: 4
  branch_depth_tokens: [256, 512, 768]
  max_generation_segments: 6
  max_response_tokens: 1536
  children_per_branch: 3
  leaf_cap_per_task: 108
  replay_allocations: 50000
  replay_token_budgets: [4096, 8192, 16384]
  baselines: [flat_iid_same_loss, uniform_tree_same_loss, entropy_same_loss, value_only_same_loss, gradient_only_same_loss, joint_no_cross_same_loss, treepo_likelihood_same_jag_loss, oracle_moment_allocation]
  gate:
    gradient_mse_per_token_relative_reduction: 0.15
    relative_bias_max: 0.02
    bias_z_score_max: 2.0
    success_strata_improved_min: 3
    success_strata_total: 4
    allocation_rank_spearman_min: 0.40
    exact_sketch_rank_spearman_min: 0.70
    learned_oracle_uniform_gap_closed_min: 0.60
    exact_blocks_agree_min: 2
    exact_blocks_total: 3
    overhead_fraction_max: 0.08
    logprob_mean_absolute_error_max: 1.0e-4
    logprob_p99_absolute_error_max: 1.0e-3

phase2:
  train_data: [TACO]
  task_filter: static_preregistered_source_ast_and_overlap_only
  pilot_tasks: 4000
  formal_tasks_min: 8000
  formal_tasks_max: 15000
  warmup_updates: 15
  screening_updates: 200
  formal_updates_min: 600
  formal_updates_max: 800
  prompt_batch: 64
  group_size: 8
  root_samples_min: 1
  root_samples_max: 8
  leaf_cap_per_prompt: 8
  max_response_tokens: 2048
  unique_continuation_tokens_per_prompt_target: 8192
  reward: binary_all_tests_pass
  baselines: [flat_iid_same_loss, uniform_tree_same_loss, entropy_tree_same_loss, value_only_tree_same_loss, treepo_likelihood_same_jag_loss]
  gate:
    primary_metric: normalized_validation_auc_per_generated_token
    primary_relative_gain: 0.10
    locked_pass_at_1_absolute_gain: 0.01
    token_efficiency_relative_gain_alternative: 0.20
    paired_ci_excludes_zero: true
    secondary_multiplicity_correction: holm
    sealed_pass_at_1_degradation_max: 0.005
    paired_hierarchical_ci_required: true
    screening_fraction: 0.25
    kill_if_auc_upper_ci_below_uniform_tree: true

kill_conditions:
  - exact_estimator_bias_exceeds_tolerance
  - oracle_allocator_does_not_beat_uniform
  - learned_allocation_gain_disappears_under_exact_gradient_audit
  - final_gain_explained_by_more_generated_or_scored_tokens
