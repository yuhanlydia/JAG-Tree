schema_version: "0.2"
direction: gradient_optimal_active_verification
base_config: shared.yaml
status: preregistration_manifest_non_executable_until_deep_merge_loader_exists

gradient_target:
  estimator: on_policy_linear_leave_one_out
  linear_target: true
  primary_clipping: false
  updates_per_rollout_batch: 1
  metric_w: identity
  sketch_dimension: 256
  sketch_distribution: rademacher_scaled
  sketch_seed: 9517
  exact_registered_blocks: 3

belief:
  output: joint_candidate_residual_second_moment
  conditions_on: [cheap_evidence, full_group_gradient_geometry]
  cross_fitted: true
  marginal_calibration: temperature_dev_only
  joint_metrics: [joint_log_score, energy_score, pairwise_covariance_rmse, conditional_audit_calibration]

acquisition:
  objective: exact_aipw_design_gradient_mse_per_cost
  design: full_support_subset_softmax
  subsets_enumerated_for_group_size_8: 256
  empty_subset_allowed: true
  inclusion_probabilities: [pi_i, pi_ij]
  inclusion_probabilities_exactly_summed_before_sampling: true
  randomized: true
  sequential_outcome_adaptation_primary: false
  budget_enforcement: expected_over_global_prompt_batch
  primary_budget_fraction: 0.10
  primary_inclusion_floor: 0.02
  sensitivity_budget_floor_pairs:
    - {budget: 0.05, floor: 0.005}
    - {budget: 0.20, floor: 0.02}
    - {budget: 0.40, floor: 0.05}
  correction: augmented_inverse_inclusion_probability
  propensity_known_from_design: true
  propensity_logged_before_outcome: true
  self_normalization_primary: false
  clipping_primary: false
  solver:
    initialization: [uniform, poisson_neyman, bayes_voi, random_1, random_2, random_3, random_4, random_5]
    algorithm: mirror_descent_with_cost_dual_bisection
    steps: 200
    learning_rate: 0.05
    expected_cost_tolerance: 1.0e-4
    select_restart_by: lowest_exact_feasible_design_mse

oracle_noise_model:
  panel: synthetic_oracle
  task_success_latent: {distribution: beta, alpha: 2.0, beta: 6.0}
  checkpoint_logit_offsets: pinned_in_manifest
  candidate_utility_given_task: bernoulli
  medium_noise:
    false_negative: 0.10
    false_positive: 0.20
    flip_icc: 0.60
    cluster_size: 4
  flip_rate_distribution: beta_with_mean_and_concentration
  beta_concentration_from_icc: "1 / icc - 1"
  icc_sweep: [0.0, 0.3, 0.6, 0.9]
  false_negative_sweep: [0.0, 0.05, 0.10, 0.20, 0.30]
  false_positive_sweep: [0.0, 0.10, 0.20, 0.30, 0.40]
  coverage_tests_per_candidate: [1, 2, 4, 8]
  anchor_corruption: [0.0, 0.01, 0.05]
  oracle_inference: quadrature_and_enumeration

real_suite_panel:
  utility_source: evaluator_side_registered_full_suite
  posterior_claim: model_based_cross_fitted_not_oracle
  full_utility_visible_to_trainer: false

phase0:
  tasks_min: 256
  tasks_max: 512
  group_size: 8
  tests_per_task_min: 32
  tests_per_task_max: 48
  audit_budget_fractions: [0.05, 0.10, 0.20, 0.40, 1.0]
  primary_budget_fraction: 0.10
  subset_draws_per_group_design: 200
  fixed_test_pool: true
  test_generator: false
  full_utility_location: evaluator_sidecar_only
  arms: [cheap_only, uniform_subset_ht, uniform_subset_aipw, entropy_subset_aipw, killrate_subset_aipw, poisson_neyman_aipw, bayes_voi_aipw, goav_exact_subset_aipw, deterministic_topk_invalid, full_audit]
  gate:
    primary_noise: medium_noise
    primary_budget_fraction: 0.10
    gradient_nmse_point_relative_reduction_min: 0.20
    paired_seed_task_ci_lower_min: 0.0
    gradient_cosine_absolute_gain_min: 0.05
    standardized_design_bias_max: 0.05
    effective_sample_size_fraction_min: 0.30
    support_violations_max: 0
    sketch_exact_rank_spearman_min: 0.70
    real_suite_nmse_relative_reduction_min: 0.10
    real_suite_paired_ci_lower_min: 0.0

phase1:
  dataset: CodeContests-O
  replication_dataset: EvalPlus
  tasks: {train: 1000, dev: 250, test: 250}
  policy_checkpoints: 3
  group_size: 8
  tests_per_task: 48
  test_composition: {curated: 12, utrl: 12, fault_targeted: 12, metamorphic: 8, corrupt_controls: 4}
  primary_budget_fraction: 0.10
  direct_full_sidecar_replay: true
  inclusion_probability_monte_carlo_draws: 100000
  gate:
    gradient_risk_per_cpu_second_relative_gain_min: 0.15
    predicted_realized_risk_spearman_min: 0.30
    inclusion_probability_absolute_error_max: 0.005
    support_violations_max: 0
    unseen_noise_nmse_relative_reduction_min: 0.10

phase2:
  train_data: [TACO, CodeContests]
  prompt_batch_options: [32, 64]
  group_size: 8
  cheap_tests_per_group: 8
  each_cheap_test_executes_on_all_candidates: true
  primary_trusted_audit_fraction: 0.10
  primary_inclusion_floor: 0.02
  sensitivity_trusted_audit_fractions: [0.05, 0.20]
  trainer_receives_unselected_trusted_labels: false
  belief_frozen_updates_min: 100
  belief_frozen_updates_max: 200
  formal_updates_min: 800
  formal_updates_max: 1200
  fixed_pool_first: true
  causal_arms_same_loss: [cheap_imputation, uniform_subset_aipw, entropy_subset_aipw, poisson_neyman_aipw, goav_exact_subset_aipw, full_audit]
  practical_task_baselines_separate: [grpo, nc_grpo, vpo]
  gate:
    primary_comparison: goav_vs_strongest_same_loss_same_total_verification_cost
    primary_budget_fraction: 0.10
    sealed_pass_at_1_point_gain_min: 0.015
    paired_hierarchical_ci_lower_min: 0.0
    secondary_total_verification_cost_reduction: 0.30
    secondary_noninferiority_margin_pass_at_1: 0.005
    secondary_multiplicity_correction: holm

learned_test_extension:
  enabled_only_after_fixed_pool_gate: true
  coder_to_tester_updates: 4
  tester_freeze_initial_coder_updates: 200
  tests_generated_per_decision: 8
  tests_sampled_per_decision: [1, 2]
  tester_snapshot_interval: 50
  selection_score: predicted_posterior_gradient_imputation_risk_reduction_per_total_cost
  training_reward: detached_cross_fitted_dr_realized_risk_reduction_per_total_cost
  risk_estimator: two_independent_audit_replicate_cross_product
  audit_replicate_design: fixed_uniform_full_support_independent_of_test_and_pre_post_models
  audit_replicates: 2
  audit_replicate_rng_independent: true
  pre_post_contrast_reuses_same_replicates: true
  both_replicate_costs_charged: true
  external_metric: evaluator_sidecar_realized_gradient_mse_reduction_per_total_cost
  external_relative_gain_min: 0.15
  feasibility_constraints: [compile, type, timeout, duplicate]
  generated_test_self_grading_allowed: false

kill_conditions:
  - oracle_joint_design_does_not_beat_random_or_poisson_neyman
  - gain_disappears_after_exact_inclusion_correction
  - support_or_effective_sample_size_failure
  - learned_tester_wins_only_on_self_controlled_belief_or_tests
