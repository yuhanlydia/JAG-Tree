schema_version: "0.1"
status: preregistered_starting_point
as_of: "2026-09-07"

models:
  plumbing: Qwen/Qwen2.5-Coder-1.5B-Instruct
  primary: Qwen/Qwen2.5-Coder-7B-Instruct
  replication: Qwen/Qwen3-8B
  dtype_formal: bfloat16
  pilot_quantization: nf4
  lora:
    rank: 32
    alpha: 64
    dropout: 0.0

generation:
  temperature: 1.0
  top_p: 1.0
  prompt_tokens_max: 2048
  response_tokens_primary: 2048
  response_tokens_sensitivity: 4096
  group_size: 8

optimizer:
  actor_learning_rate: 1.0e-6
  updates_per_rollout_batch: 1
  primary_objective: on_policy_unclipped
  kl_penalty_primary: 0.0
  gradient_clip_norm_primary: null
  gradient_clip_norm_practical_extension: 1.0

data_policy:
  required_roles: [train, dev, mechanism_test, locked_test]
  manifest_required: true
  deduplicate_statement: true
  deduplicate_code: true
  deduplicate_tests: true
  temporal_filter_final: true
  locked_queries_per_selected_checkpoint: 1

statistics:
  training_seeds: [17, 29, 43]
  bootstrap_resamples: 10000
  confidence_level: 0.95
  bootstrap_unit: task
  report_individual_seeds: true
  multiple_testing_secondary: holm

budgets:
  ledgers: [generation_tokens, verification_core_seconds, optimization_gpu_hours, wall_time]
  calibration_fraction: 0.01
  abort_peak_memory_fraction: 0.90
  abort_infrastructure_failure_rate: 0.01
  abort_projected_cost_overrun_fraction: 0.25

execution:
  container_digest_required: true
  network: disabled
  deterministic_hash_seed: true
  timeout_is_separate_outcome: true
  outcome_alphabet: [PASS, WRONG, EXCEPTION, TIMEOUT]

reporting:
  mechanism_metric_required: true
  quality_frontiers: [generated_tokens, verification_core_seconds, wall_time]
  config_sha_required: true
  manifest_sha_required: true
  raw_logs_preserved: true
