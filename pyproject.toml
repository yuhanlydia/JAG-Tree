[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jag-tree"
version = "0.2.0"
description = "Genealogy-aware allocation and credit for auditable tree RLVR experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]
torch = ["torch>=2.2"]
models = ["torch>=2.2", "transformers>=4.45", "peft>=0.13", "accelerate>=0.34", "bitsandbytes>=0.43"]
benchmarks = ["datasets>=3", "evalplus>=0.3"]
training = ["torch>=2.2", "transformers>=4.45", "peft>=0.13", "accelerate>=0.34", "bitsandbytes>=0.43", "datasets>=3", "evalplus>=0.3"]

[project.scripts]
jag-tree = "jag_tree.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
