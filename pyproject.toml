[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-opsd"
version = "0.1.0"
description = "Deterministic Phase-0 reference utilities for coding operations design"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6.0"]

[project.scripts]
coding-opsd = "coding_opsd.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
