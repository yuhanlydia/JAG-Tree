name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phase0-reference:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      WANDB_MODE: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources and tests
        run: python -m compileall -q src tests
      - name: Validate checked-in Phase 0 overlays
        run: |
          python -m coding_opsd validate configs/phase0/jag_smoke.yaml
          python -m coding_opsd validate configs/phase0/pbpf_smoke.yaml
          python -m coding_opsd validate configs/phase0/goav_smoke.yaml

