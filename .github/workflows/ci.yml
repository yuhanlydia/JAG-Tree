name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      WANDB_MODE: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight package and tests
        run: python -m pip install -e '.[test]'
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Compile and check shell syntax
        run: |
          python -m compileall -q src tests
          bash -n scripts/*.sh
      - name: Plan every experiment without downloads
        run: |
          for config in configs/experiments/*.yaml; do
            python -m jag_tree plan "$config" >/dev/null
          done
      - name: Offline fake-backend smoke and verification
        run: |
          smoke_root="$(mktemp -d)"
          scripts/run_smoke.sh "$smoke_root" 7 >/dev/null
          python -m jag_tree verify "$smoke_root"/run-* >/dev/null
